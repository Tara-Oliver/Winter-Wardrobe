<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="reset.css">
        <link rel="stylesheet" href="style2.css">
        <title>Building Your Wardrobe</title>
        <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/512/3287/3287185.png" type="image/x-icon">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <link href="https://fonts.googleapis.com/css2?family=Julius+Sans+One&display=swap" rel="stylesheet">

        <link href="https://fonts.googleapis.com/css2?family=Birthstone+Bounce:wght@500&display=swap" rel="stylesheet">

        <link href="https://fonts.googleapis.com/css2?family=PT+Serif&display=swap" rel="stylesheet">
    </head>
<body>
    <header>
        <h1 class="top-header">BUILDING YOUR <br> WARDROBE:</h1>
        <h2 class="btm-header">WINTER  <br> BASICS</h2>
    </header>

    <nav class="nav-bar">
        <a href="index.html">Welcome!</a>
        <a href="pg2.html">Sign Up</a>
        <a href="pg3.html">eBooks</a>
        <a href="pg4.html">Gallery</a>
    </nav>

    <div class="form-container">
        <div class="sign-up-form">
            <form action="">
                <fieldset>
                    <legend>Stay in Style</legend>
                    <p class="form-subtitle">Fashion Tips at your fingertips!</p>

                    <div>
                        <input required='' type='text'>
                        <label alt='First Name' placeholder='First Name'></label>
                    </div>

                    <div>
                        <input required='' type='text'>
                        <label alt='Last Name' placeholder='Last Name'></label>
                    </div>

                    <div>
                        <input required='' type='email'>
                        <label alt='Email' placeholder='Email'></label>
                    </div>


                    <div class="checklist">
                        <p> What style are you looking for?</p>


                       <label class="check-label" for="vintage">
                            <input type="checkbox" name="vintage">
                            Vintage
                        </label>


                        <label class="check-label" for="bohemian">
                            <input type="checkbox" id="bohemian">
                            Bohemian
                        </label>


                        <label class="check-label" for="chic">
                        <input type="checkbox" id="chic">
                        Chic
                        </label>
                    </div>

                    <div>
                            <label class="text-label" for="comments">Describe your lifestyle & styles you love to wear:</label>
                                <textarea required='' name="comments" id="comments" cols="40" rows="10"></textarea>
                    </div>

                    <div>
                        <button type="submit">Sign up</button>
                    </div>

                </fieldset>
            </form>
        </div>
    </div>

</body>
</html>
